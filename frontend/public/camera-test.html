<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>PhysioAI Camera Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #102f2a;
      color: white;
      font-family: Arial, sans-serif;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .camera-box {
      width: min(900px, 100%);
      aspect-ratio: 16 / 9;

      background: black;
      border-radius: 20px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: black;
    }

    button {
      margin-top: 20px;
      padding: 12px 22px;

      border: none;
      border-radius: 10px;

      background: white;
      color: #12302b;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    #status {
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

  <h1>PhysioAI Camera Test</h1>

  <div class="camera-box">
    <video
      id="camera"
      autoplay
      muted
      playsinline
    ></video>
  </div>

  <button id="startButton">
    Start Camera
  </button>

  <div id="status">
    Camera not started
  </div>

  <script>
    const video = document.getElementById("camera");
    const button = document.getElementById("startButton");
    const status = document.getElementById("status");

    let stream = null;

    button.addEventListener("click", async () => {
      try {
        status.textContent = "Requesting camera...";

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user"
          },
          audio: false
        });

        video.srcObject = stream;

        await video.play();

        status.textContent =
          "✅ Camera working: " +
          video.videoWidth +
          " × " +
          video.videoHeight;

        console.log("Camera stream:", stream);
        console.log(
          "Video:",
          video.videoWidth,
          "x",
          video.videoHeight
        );

      } catch (error) {

        console.error("Camera error:", error);

        status.textContent =
          "❌ " + error.name + ": " + error.message;
      }
    });
  </script>

</body>
</html>
